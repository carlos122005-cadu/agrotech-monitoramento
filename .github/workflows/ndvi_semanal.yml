name: Boletim Semanal de Pastagem (NDVI Sentinel-2)

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  analisar-pastagem:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências geoespaciais
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calcular NDVI Sentinel-2 e Enviar Boletim
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FAZENDA_LAT: ${{ secrets.FAZENDA_LAT }}
          FAZENDA_LON: ${{ secrets.FAZENDA_LON }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: python boletim_semanal_ndvi.py
        
