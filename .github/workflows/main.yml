name: Sentinela VectorX Agro 24/7

on:
  schedule:
    # A cada 30 min das 10h às 20h BRT (13h às 23h UTC) + rotina das 06h BRT (09h UTC)
    - cron: '*/30 13-23 * * *'
    # A cada 2 horas na madrugada/início da manhã BRT (00h às 12h UTC)
    - cron: '0 0,2,4,6,8,9,10,12 * * *'
  workflow_dispatch:

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Monitoramento de Fogo e Clima
        env:
          FAZENDA_LAT: ${{ secrets.FAZENDA_LAT }}
          FAZENDA_LON: ${{ secrets.FAZENDA_LON }}
          RAIO_ALERTA_KM: ${{ secrets.RAIO_ALERTA_KM }}
          NASA_FIRMS_KEY: ${{ secrets.NASA_FIRMS_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python monitor_fogo_clima.py
        
